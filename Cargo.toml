[workspace]
resolver = "3"
members = [
    "app",
    "crates/notchforge-core",
    "crates/notchforge-providers",
    "crates/notchforge-macos",
    "crates/notchforge-notify",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/AmdjedBelgacem/Notchify"

[workspace.dependencies]
notchforge-core = { path = "crates/notchforge-core" }
notchforge-providers = { path = "crates/notchforge-providers" }
notchforge-macos = { path = "crates/notchforge-macos" }

tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"
anyhow = "1"
dirs = "6"
plist = "1.7"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
rusqlite = { version = "0.37" }
sha2 = "0.10"
base64 = "0.22"

objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-core-location = "0.3"
objc2-service-management = "0.3"
objc2-user-notifications = "0.3"
objc2-quartz-core = "0.3"
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"
block2 = "0.6"
dispatch2 = "0.3"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
